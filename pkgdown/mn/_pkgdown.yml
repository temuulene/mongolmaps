url: https://temuulene.github.io/mongolmaps/mn/
lang: mn
template:
  bootstrap: 5
  bslib:
    primary: "#0ea5e9"
    success: "#22c55e"
    warning: "#f59e0b"
    danger: "#ef4444"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter Tight"}
    code_font: {google: "JetBrains Mono"}
    enable-dark-mode: true
figures:
  dev: ragg::agg_png
  dpi: 150
  fig.width: 7
  fig.height: 4.5
navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, english, github]
  components:
    intro:
      text: Эхлэх
      href: articles/mongolmaps.html
    reference:
      text: Функцүүд
      href: reference/index.html
    articles:
      text: Нийтлэлүүд
      menu:
        - text: Эхлэх
          href: articles/mongolmaps.html
        - text: Улаанбаатарын газрын зураг
          href: articles/ulaanbaatar.html
        - text: Өгөгдлөө газрын зураг дээр
          href: articles/joining-data.html
        - text: Нэр ба код
          href: articles/names-and-codes.html
        - text: -------
        - text: Зам, ус, суурин
          href: articles/thematic-layers.html
        - text: Гадаргуу, газрын бүрхэвч, хүн ам
          href: articles/terrain-population.html
        - text: Багийн хил ҮСХ-оос
          href: articles/bags-from-nso.html
    english:
      text: English
      href: https://temuulene.github.io/mongolmaps/
      aria-label: English version
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/temuulene/mongolmaps
home:
  title: "mongolmaps: Монгол Улс, Улаанбаатарын газрын зураг R-д"
  description: Монгол Улсын засаг захиргааны нэгжийн хил, газрын зураг R програмд. Улсаас хороо хүртэл.
  sidebar:
    structure: [holboos, litsenz, ish, khugjuulegch]
    components:
      holboos:
        title: Холбоос
        text: |
          [English](https://temuulene.github.io/mongolmaps/)

          [Эх код (GitHub)](https://github.com/temuulene/mongolmaps)

          [Алдаа мэдээлэх](https://github.com/temuulene/mongolmaps/issues)
      litsenz:
        title: Лиценз
        text: |
          Код: [MIT](LICENSE.html). Өгөгдөл бүр өөрийн эх сурвалжийн лицензтэй,
          `mn_sources()` функцээр харна.
      ish:
        title: Иш татах
        text: "[Иш татах заавар](authors.html#citation)"
      khugjuulegch:
        title: Хөгжүүлэгч
        text: Temuulen Enebish
footer:
  structure:
    left: khugjuulsen
    right: pkgdown_mn
  components:
    khugjuulsen: "Хөгжүүлсэн: Temuulen Enebish."
    pkgdown_mn: "[pkgdown](https://pkgdown.r-lib.org/) ашиглан бүтээв."
articles:
  - title: Гарын авлага
    navbar: ~
    contents:
      - articles/mongolmaps
      - articles/ulaanbaatar
      - articles/joining-data
      - articles/names-and-codes
  - title: Бусад давхарга
    contents:
      - articles/thematic-layers
      - articles/terrain-population
      - articles/bags-from-nso
reference:
  - title: Хил хязгаар
    desc: Засаг захиргааны бүх түвшний газрын зураг, ижил баганатай.
    contents:
      - mn_admin
      - mn_country
      - mn_aimags
      - mn_soums
      - mn_ub
      - mn_bags
  - title: Нэр ба код
    contents:
      - mn_match
      - mn_codes
      - mn_translit
  - title: Өгөгдөл холбох
    contents:
      - mn_join
      - mn_example_population
  - title: Сэдэвчилсэн давхарга
    contents:
      - mn_settlements
      - mn_neighbours
      - mn_roads
      - mn_protected_areas
  - title: Растер давхарга
    desc: Өндөршил, газрын бүрхэвч, хүн амын тор (terra багц шаардлагатай).
    contents:
      - mn_elevation
      - mn_landcover
      - mn_population
      - mn_zonal
  - title: Газрын зураг зурах
    contents:
      - mn_map
      - theme_mn
      - mn_leaflet
      - mn_label_points
      - mn_crs
      - mn_aimag_grid
  - title: Өгөгдлийн эх сурвалж, кэш
    contents:
      - mn_sources
      - mn_cache_dir
  - title: Багц
    contents:
      - mongolmaps-package
