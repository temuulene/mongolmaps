name: pkgdown

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::ggrepel
            any::patchwork
            any::leaflet
            any::terra
            any::ragg
            any::xml2
            local::.
          needs: website

      - name: Build site
        env:
          NOT_CRAN: "true"
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Build Mongolian site
        env:
          NOT_CRAN: "true"
        run: Rscript pkgdown/build-mn.R

      - name: Check Mongolian reference translations
        run: Rscript pkgdown/mn-reference.R check

      - name: Verify article maps and links
        run: Rscript pkgdown/verify-articles.R

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
